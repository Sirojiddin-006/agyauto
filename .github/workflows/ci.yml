name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          - {os: macos-latest, python: "3.8"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: unit + e2e tests
        run: |
          python -m unittest discover -s tests -v > /tmp/test.log 2>&1 || {
            echo "::error title=tests failed::$(grep -A22 -E '^(ERROR|FAIL):' /tmp/test.log | head -c 3500 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            cat /tmp/test.log
            exit 1
          }
      - name: installer smoke test
        run: |
          export HOME="$(mktemp -d)"
          tar -czf /tmp/src.tgz -C .. "$(basename "$PWD")"
          AGYAUTO_TARBALL=file:///tmp/src.tgz sh install.sh
          "$HOME/.local/bin/agyauto" version
          "$HOME/.local/bin/agyauto" uninstall
